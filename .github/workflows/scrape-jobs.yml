name: Scrape Jobs

on:
  schedule:
    - cron: '0 */6 * * *' # Every 6 hours
  workflow_dispatch: # Manual trigger

# A manual dispatch landing on top of a cron run would have two processes
# upserting the same rows, and the read-then-write in processScraperResults is
# not atomic. Backfill shares this group so the two can never overlap.
concurrency:
  group: scrape-jobs
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Hard kill. RUN_BUDGET_MS (50 min) is the soft budget that lets the run exit
    # cleanly with a summary before this fires. Measured: the 15 pre-existing
    # scrapers alone take ~34 min, so the budget must clear that plus the five
    # new sources. NOTE: on a private repo this is ~7,200 Actions min/month at
    # 4 runs/day — well past the 2,000-min free tier.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'
        run: pnpm install --frozen-lockfile

      # Cheap, no network, no DB. Guards the uploader's batching logic, which
      # is what keeps the run inside the Supabase egress budget.
      - name: Run tests
        run: pnpm test

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium --with-deps

      - name: Run scrapers
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Tunable from repo Variables without needing a commit.
          # FULL_BACKFILL is deliberately absent: it must be impossible to
          # trigger an unbounded crawl from the 6-hourly cron path.
          RECENCY_DAYS: ${{ vars.RECENCY_DAYS || '7' }}
          RUN_BUDGET_MS: ${{ vars.RUN_BUDGET_MS || '3000000' }}
          TEAL_MAX_JOBS: ${{ vars.TEAL_MAX_JOBS || '500' }}
          JOBSTAIRS_MAX_JOBS: ${{ vars.JOBSTAIRS_MAX_JOBS || '500' }}
          ENGLISHJOBS_MAX_JOBS: ${{ vars.ENGLISHJOBS_MAX_JOBS || '400' }}
          FINN_MAX_JOBS: ${{ vars.FINN_MAX_JOBS || '400' }}
          JOBBSAFARI_MAX_JOBS: ${{ vars.JOBBSAFARI_MAX_JOBS || '400' }}
          # Vertical rotation (lib/verticals.js). Software/Internet/AI is pinned
          # to every run; 6 of the other 18 roots rotate, so a full cycle is
          # 3 runs = 18h. VERTICALS_ALL is deliberately absent — an unbounded
          # sweep belongs only to the manual backfill workflow.
          VERTICALS_PER_RUN: ${{ vars.VERTICALS_PER_RUN || '6' }}
          VERTICALS_PINNED: ${{ vars.VERTICALS_PINNED || 'software-internet-ai' }}
          VERTICALS_ONLY: ${{ vars.VERTICALS_ONLY || '' }}
          VERTICALS_SKIP: ${{ vars.VERTICALS_SKIP || '' }}
          MAX_JOBS_PER_VERTICAL: ${{ vars.MAX_JOBS_PER_VERTICAL || '' }}
          # Boards that previously had no cap at all. WeWorkRemotely drives
          # Playwright per detail page and its feed count went 4 -> 9; CutShort
          # was paths x 10 pages with no ceiling and its path count went 6 -> 14.
          WEWORKREMOTELY_MAX_JOBS: ${{ vars.WEWORKREMOTELY_MAX_JOBS || '250' }}
          CUTSHORT_MAX_JOBS: ${{ vars.CUTSHORT_MAX_JOBS || '300' }}
          TEAL_MAX_QUERIES: ${{ vars.TEAL_MAX_QUERIES || '14' }}
          # Keep mappings additive for the first week after the matcher change:
          # the uploader reconciles categories for unchanged jobs, so the first
          # run would otherwise delete mappings the old keyword map produced
          # across 15,027 already-categorised jobs.
          CATEGORY_ADDITIVE_ONLY: ${{ vars.CATEGORY_ADDITIVE_ONLY || 'true' }}
          # Off until the "Probe Slices" workflow confirms these boards accept
          # non-software search terms from GitHub's network. Neither can be
          # verified from a developer machine.
          NAUKRIGULF_VERTICALS_ENABLED: ${{ vars.NAUKRIGULF_VERTICALS_ENABLED || 'false' }}
          JOBSINJAPAN_VERTICALS_ENABLED: ${{ vars.JOBSINJAPAN_VERTICALS_ENABLED || 'false' }}
        run: node runScrapers.js
